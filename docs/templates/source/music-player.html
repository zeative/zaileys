  var list = DATA && DATA.playlist && DATA.playlist.length ? DATA.playlist : [{ title: "Example Track", artist: "Zaileys Synth", bpm: 100, mood: "happy" }];
  var tracks = list.map(normalize);

  var ac = null, chain = null, analyser = null, freq = null, sess = null, timer = 0, raf = 0, suspendT = 0, dragging = false, dragFrac = 0, page = 0;

  function cur() { return tracks[P.i]; }
  function dur(tr) { tr = tr || cur(); return tr.dur == null ? NaN : tr.dur; }
  function elapsed() { if (P.playing && sess) return clamp(ac.currentTime - sess.t0, 0, dur(sess.tr)); return P.pos; }

  function ensureAudio() {

  function applyVolume() {

  function startSession(pos) {

  function tick() {

  function onEnded() {

    setTrack(nx);
    beginPlayback(0);
  }

  function nextIndex(auto) {

  function pause() {

  function setTrack(i) {

  function changeTrack(i, keepHistory) {

  function seekTo(sec) {

  function renderList() {

    $("pager").hidden = pages < 2;

    $("play").setAttribute("aria-label", P.playing ? "Pause" : "Play");
    $("shuffle").setAttribute("aria-pressed", P.shuffle);

    $("mute").setAttribute("aria-pressed", P.muted);
    $("mute").setAttribute("aria-label", P.muted ? "Unmute" : "Mute");

  }

  $("repeat").addEventListener("click", function () { P.repeat = (P.repeat + 1) % 3; render(); });
  $("mute").addEventListener("click", function () {

    applyVolume(); render();

  $("vol").addEventListener("input", function () { P.vol = Number(this.value) / 100; if (P.vol > 0) P.muted = false; applyVolume(); render(); });

    var panel = $("panel"), open = panel.hidden;
    panel.hidden = !open;
    $("now").style.visibility = open ? "hidden" : "";
    this.setAttribute("aria-expanded", open);
    if (open) { page = Math.floor(P.i / PAGE); renderList(); }
  });
  $("pgPrev").addEventListener("click", function () { page--; renderList(); });
  $("pgNext").addEventListener("click", function () { page++; renderList(); });

  function fracAt(e) { var rc = bar.getBoundingClientRect(); return clamp((e.clientX - rc.left) / rc.width, 0, 1); }

  setStatus(TEXT.tap);
  render();
