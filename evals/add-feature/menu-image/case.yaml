schema_version: "1.1"
name: add-feature-menu-image
description: "Adds an image-with-caption reply to an existing project; must follow its handler conventions."
tags: [outcome, add-feature]
context:
  scaffold_script: setup.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Tambahin fitur ke bot ini: kalau pelanggan kirim "menu", bot kirim gambar menu (pakai config.menuImage) dengan caption daftar menu: Kopi Susu 18rb, Americano 15rb, Croissant 20rb. Taruh handlernya di src/handlers/menu.ts dan ikutin struktur serta gaya kode yang udah ada.

    Dependency sudah terpasang, jangan install ulang.
graders:
  - name: handler-file
    type: file_exists
    path: src/handlers/menu.ts
  - name: registered
    type: regex
    target: { source: file, path: src/handlers/index.ts }
    pattern: "register(?!Ping)\\w*\\(\\s*client\\s*\\)"
  - name: sends-image
    type: regex
    target: { source: file, path: src/handlers/menu.ts }
    pattern: "\\.image\\("
  - name: caption
    type: regex
    target: { source: file, path: src/handlers/menu.ts }
    pattern: "caption"
  - name: no-chatid-as-destination
    type: regex
    target: { source: file, path: src/handlers/menu.ts }
    pattern: "send\\(\\s*\\w+\\.chatId"
    match: not_contains
  - name: ping-untouched
    type: regex
    target: { source: file, path: src/handlers/ping.ts }
    pattern: "await msg\\.reply\\('pong'\\)"
