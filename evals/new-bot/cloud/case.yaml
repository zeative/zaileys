schema_version: "1.1"
name: new-bot-cloud
description: "New Cloud API bot with an Express webhook; checks the signed, fetch-style webhook wiring."
tags: [outcome, new-bot]
context:
  scaffold_script: setup.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Bikin bot zaileys pakai WhatsApp Cloud API yang resmi (bukan WhatsApp Web). Setiap pesan teks dibalas "Halo! Pesan kamu: <isi pesan>". Webhook-nya jalan di Express port 3000, dan semua kredensial diambil dari environment variable. Siap dipakai produksi ya.

    Dependency (zaileys, express, @types/express, typescript, @types/node) sudah terpasang, jangan install ulang. Taruh kodenya di src/server.ts.
graders:
  - name: server-file
    type: file_exists
    path: src/server.ts
  - name: cloud-provider
    type: regex
    target: { source: file, path: src/server.ts }
    pattern: "provider:\\s*['\"]cloud['\"]"
  - name: signed-webhook
    type: regex
    target: { source: file, path: src/server.ts }
    pattern: "appSecret"
  - name: raw-body
    type: regex
    target: { source: file, path: src/server.ts }
    pattern: "express\\.raw\\("
  - name: fetch-style-handler
    type: regex
    target: { source: file, path: src/server.ts }
    pattern: "new Request\\("
  - name: no-qr-on-cloud
    type: regex
    target: { source: file, path: src/server.ts }
    pattern: "\\.on\\(\\s*['\"]qr['\"]"
    match: not_contains
