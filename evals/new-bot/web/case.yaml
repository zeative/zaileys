schema_version: "1.1"
name: new-bot-web
description: "New WhatsApp Web bot from an empty project; the code must type-check against the real zaileys."
tags: [outcome, new-bot]
context:
  scaffold_script: setup.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Bikinin bot WhatsApp pakai zaileys di folder ini: kalau ada yang kirim "ping", bot balas "pong". Login pakai QR, dan sesinya harus tetap tersimpan setelah restart.

    Dependency (zaileys, typescript, @types/node) sudah terpasang, jangan install ulang. Taruh kodenya di src/bot.ts.
graders:
  - name: bot-file
    type: file_exists
    path: src/bot.ts
  - name: text-handler
    type: regex
    target: { source: file, path: src/bot.ts }
    pattern: "\\.on\\(\\s*['\"](text|message)['\"]"
  - name: no-chatid-as-destination
    type: regex
    target: { source: file, path: src/bot.ts }
    pattern: "send\\(\\s*\\w+\\.chatId"
    match: not_contains
