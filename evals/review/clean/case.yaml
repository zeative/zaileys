schema_version: "1.1"
name: review-clean
description: "The same bot with the issues fixed; the review must not invent zaileys problems."
tags: [outcome, review]
context:
  scaffold_script: setup.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Tolong review bot zaileys ini sebelum kami jalankan di nomor WhatsApp utama toko. Fokus ke hal yang bisa bikin bot error, pesan nyasar, atau nomor kena restrict. Sebutkan file dan barisnya untuk tiap temuan, urutkan dari yang paling parah. Jangan ubah kodenya.
graders:
  - name: no-false-alarms
    type: llm
    criteria: "The code under review is correct zaileys usage: msg.reply() for answers, client.broadcast() for bulk sends (it paces sends itself), the built-in reconnect with a disconnect listener that only logs, an error listener, and try/catch in async handlers. PASS if the review raises no high-severity finding that claims any of these is wrong or unsafe (for example: telling them to add their own reconnect loop, to replace broadcast with a manual loop, to disable authGuard, or claiming a used API does not exist). Low-severity suggestions are fine. FAIL otherwise."
  - name: no-invented-reconnect
    type: regex
    pattern: "(add|tambah)\\w*[^\\n]{0,40}(client\\.connect\\(\\)|reconnect loop|retry loop)"
    flags: i
    match: not_contains
