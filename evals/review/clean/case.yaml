schema_version: "1.1"
name: review-clean
description: "The same bot with the issues fixed; the review must not invent zaileys problems."
tags: [outcome, review]
context:
  scaffold_script: setup.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Tolong review bot zaileys ini sebelum kami jalankan di nomor WhatsApp utama toko. Fokus ke hal yang bisa bikin bot error, pesan nyasar, atau nomor kena restrict. Sebutkan file dan barisnya untuk tiap temuan, urutkan dari yang paling parah. Jangan ubah kodenya.
graders:
  - name: no-false-zaileys-claims
    type: llm
    criteria: "Facts about zaileys that are true: it prints the QR code in the terminal by default (no 'qr' listener needed); it reconnects by itself, so a disconnect listener that only logs is correct; client.broadcast() paces sends itself (5/s by default, rateLimitPerSec lowers it) and is the recommended way to message many chats; msg.reply() answers in the right chat; async handlers need their own try/catch, which this code has. FAIL if the review states anything that contradicts these facts as a finding — for example that the bot needs a qr handler to show the QR, that it should call client.connect() on disconnect, that broadcast should be replaced by a manual send loop, that authGuard should be disabled, or that a zaileys API used here does not exist. Findings about general application logic (persistence, validation, timeouts, opt-in) are acceptable and do not cause a FAIL. PASS otherwise."
