schema_version: "1.1"
name: upgrade-cloud-unsigned
description: "Upgrades a 4.14 Cloud API bot whose webhook has no appSecret; 4.15 rejects unsigned deliveries."
tags: [outcome, upgrade]
context:
  scaffold_script: setup.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Mau upgrade bot Cloud API ini dari zaileys 4.14.1 ke 4.15.1 (sudah terpasang, tinggal update package.json). Ada yang perlu diubah di kode atau konfigurasi supaya bot tetap terima pesan setelah deploy? Kerjakan sekalian ya.
graders:
  - name: version-bumped
    type: regex
    target: { source: file, path: package.json }
    pattern: "\"zaileys\":\\s*\"[\\^~]?4\\.15\\.1\""
  - name: app-secret-configured
    type: regex
    target: { source: file, path: src/server.ts }
    pattern: "appSecret:\\s*process\\.env\\.\\w+"
  - name: not-unsigned
    type: regex
    target: { source: file, path: src/server.ts }
    pattern: "allowUnsigned:\\s*true"
    match: not_contains
  - name: env-documented
    type: regex
    target: { source: file, path: .env.example }
    pattern: "SECRET"
